packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts unless they are listed here.
# Approve new entries with `pnpm approve-builds <pkg>` and review them in the PR.
allowBuilds:
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    # zod inside @expo/cli (Expo SDK 57 build tooling, not shipped in the app).
    # Remove when apps/mobile moves to Expo SDK 58.
    - GHSA-mrhx-c7xc-m3w5
