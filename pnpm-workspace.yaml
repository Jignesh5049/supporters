packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts unless they are listed here.
# Approve new entries with `pnpm approve-builds <pkg>` and review them in the PR.
allowBuilds:
  # Denied on purpose: jest-haste-map loads the prebuilt @parcel/watcher-<platform> binary;
  # the script only compiles from source when npm_config_build_from_source is set.
  '@parcel/watcher': false
  # Denied on purpose: tsx runs esbuild from its @esbuild/<platform> package without the script.
  esbuild: false
  unrs-resolver: true
  # apps/api: none of these scripts are needed. argon2 ships N-API prebuilds
  # (linux-x64, win32-x64, darwin-arm64), Prisma 7 runs its engines as Wasm, and
  # the rest are optional native speed-ups or version checks in testcontainers' deps.
  '@prisma/engines': false
  argon2: false
  cpu-features: false
  prisma: false
  protobufjs: false
  ssh2: false
  # apps/api (bullmq): msgpackr-extract is an optional native speed-up; msgpackr falls back to
  # its pure-JS codec, so the build script is not needed.
  msgpackr-extract: false

auditConfig:
  ignoreGhsas:
    # zod 3 inside @expo/cli (Expo build tooling, not shipped in the app). The fix
    # is only in zod 4.6.6+, and @expo/cli 58.1.x still depends on zod ^3.25.76.
    # Remove when @expo/cli moves to a patched zod.
    - GHSA-mrhx-c7xc-m3w5

minimumReleaseAgeExclude:
  - '@fastify/jwt@10.2.6'
