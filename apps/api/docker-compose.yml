# Local development only: PostgreSQL 18, Valkey 9 and MinIO (S3) for the API.
# Start with `docker compose up -d` from apps/api. Credentials below are
# local-only defaults that match .env.example; never reuse them elsewhere.
# Set POSTGRES_PORT, VALKEY_PORT or MINIO_PORT if those host ports are already taken.
name: supporters-api

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: supporters
      POSTGRES_PASSWORD: supporters-local
      POSTGRES_DB: supporters
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supporters -d supporters']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.0-alpine
    command: ['valkey-server', '--requirepass', 'valkey-local', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'valkey-local', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for the media bucket. MinIO no longer publishes
  # official images, so this is Chainguard's build from MinIO source, pinned by
  # digest. It runs as root because the image can't initialise its drive as its
  # non-root user; it is bound to 127.0.0.1 and holds throwaway local files only.
  # Create the bucket with `pnpm storage:init`.
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    user: '0'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio-local
      MINIO_ROOT_PASSWORD: minio-local-secret
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  valkey-data:
  minio-data:
