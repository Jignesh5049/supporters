# Production and staging stack for one Graviton EC2 server (t4g.large: 2 vCPU, 8 GB).
# Product spec, "Hosting on AWS". Run it with deploy/start.sh, which loads the secrets from SSM
# Parameter Store into the environment, runs the database migration once, and rolls the stack.
# Nothing here holds a secret: every value is read from the environment when the stack starts,
# and `${VAR:?}` makes a missing required value stop the start before anything changes.
name: supporters

x-container: &container
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    # Rotated on the host; the CloudWatch agent (deploy/cloudwatch) ships these files.
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'
      labels: com.docker.compose.service

x-node: &node
  <<: *container
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid

services:
  # TLS origin for CloudFront: the only published port. Drops any request that lacks the secret
  # X-Origin-Verify header, then routes /v1/* to the API and the rest to the web app.
  caddy:
    <<: *container
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    cap_add: [NET_BIND_SERVICE]
    ports:
      - '${CADDY_HTTPS_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443'
    environment:
      - ORIGIN_DOMAIN=${ORIGIN_DOMAIN:?ORIGIN_DOMAIN is required}
      - ORIGIN_VERIFY_SECRET=${ORIGIN_VERIFY_SECRET:?ORIGIN_VERIFY_SECRET is required}
      - ORIGIN_VERIFY_SECRET_PREVIOUS=${ORIGIN_VERIFY_SECRET_PREVIOUS:-${ORIGIN_VERIFY_SECRET}}
      - ACME_DNS_ZONE_ID=${ACME_DNS_ZONE_ID:?ACME_DNS_ZONE_ID is required}
      - CADDY_TLS_MODE=${CADDY_TLS_MODE:-route53}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m
    networks: [egress, frontend]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8081/healthz']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 192M }

  web:
    <<: *node
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    environment:
      - NODE_OPTIONS=--max-old-space-size=640
      - APP_ORIGIN=${APP_ORIGIN:?APP_ORIGIN is required}
      - API_INTERNAL_URL=http://api:3001
    networks: [frontend, egress]
    depends_on:
      api: { condition: service_healthy }
    # The image's own HEALTHCHECK (/api/health) is used.
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1G }

  api:
    <<: *node
    image: ${API_IMAGE:?API_IMAGE is required}
    environment: &api-env
      - NODE_ENV=${DEPLOY_ENV:?DEPLOY_ENV is required (staging or production)}
      - NODE_OPTIONS=--max-old-space-size=1024
      # CloudFront and Caddy: two proxy hops before the API (backend spec, Origin protection).
      - TRUST_PROXY=2
      - APP_ORIGIN=${APP_ORIGIN:?APP_ORIGIN is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - VALKEY_URL=redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}@valkey:6379
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      - JWT_KEY_ID=${JWT_KEY_ID:?JWT_KEY_ID is required}
      - OTP_HMAC_KEY=${OTP_HMAC_KEY:?OTP_HMAC_KEY is required}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      - S3_BUCKET=${S3_BUCKET:?S3_BUCKET is required}
      - MEDIA_PUBLIC_URL=${MEDIA_PUBLIC_URL:?MEDIA_PUBLIC_URL is required}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_SEARCH_KEY=${MEILI_SEARCH_KEY:?MEILI_SEARCH_KEY is required}
      - MEILI_INDEX_KEY=${MEILI_INDEX_KEY:?MEILI_INDEX_KEY is required}
      # RDS's certificate authority is not in Node's trust store; the host file is mounted below.
      - NODE_EXTRA_CA_CERTS=/certs/rds-global-bundle.pem
      # Optional: passed through only when set (see deploy/env.example).
      - LOG_LEVEL
      - CORS_ORIGINS
      - JWT_PREVIOUS_PUBLIC_KEY
      - JWT_PREVIOUS_KEY_ID
      - BREACHED_PASSWORD_CHECK
      - SMS_PROVIDER
      - S3_REGION
      - S3_ENDPOINT
      - S3_FORCE_PATH_STYLE
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - VAPID_SUBJECT
      - EXPO_ACCESS_TOKEN
      - EMAIL_PROVIDER
      - EMAIL_FROM
      - SES_REGION
    volumes:
      - ${RDS_CA_BUNDLE:-/etc/supporters/rds-global-bundle.pem}:/certs/rds-global-bundle.pem:ro
    networks: [frontend, data, egress]
    depends_on:
      valkey: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1536M }

  # The same image as the API with a different command (backend spec, Architecture).
  worker:
    <<: *node
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ['node', 'dist/worker.js']
    environment: *api-env
    volumes:
      - ${RDS_CA_BUNDLE:-/etc/supporters/rds-global-bundle.pem}:/certs/rds-global-bundle.pem:ro
    networks: [data, egress]
    depends_on:
      valkey: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    # The worker has no HTTP port, so the API image's healthcheck does not apply.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 768M }

  # Cache, rate limits and BullMQ queues. BullMQ needs noeviction; the data is small.
  valkey:
    <<: *container
    image: valkey/valkey:9.0.7-alpine@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
    user: valkey
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction --save ""
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      - REDISCLI_AUTH=${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 512M }

  meilisearch:
    <<: *container
    image: getmeili/meilisearch:v1.56.1@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
    # The image's data directory belongs to root; with every capability dropped it can still
    # write to its own files, and it is only reachable on the internal `data` network.
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      - MEILI_NO_ANALYTICS=true
      - MEILI_MAX_INDEXING_MEMORY=768MiB
    volumes:
      - meili-data:/meili_data
    tmpfs:
      - /tmp:size=64m
    networks: [data]
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 1536M }

  # One-shot: `docker compose run --rm migrate` from deploy/start.sh, before the API is replaced.
  migrate:
    <<: *container
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE is required}
    restart: 'no'
    profiles: [migrate]
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      # The schema engine uses OpenSSL, which reads this for the RDS certificate authority.
      - SSL_CERT_FILE=/certs/rds-global-bundle.pem
    volumes:
      - ${RDS_CA_BUNDLE:-/etc/supporters/rds-global-bundle.pem}:/certs/rds-global-bundle.pem:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [egress]
    deploy:
      resources:
        limits: { cpus: '1.00', memory: 512M }

networks:
  # Caddy <-> web and API. No route to the internet.
  frontend:
    internal: true
  # API, worker, Valkey and Meilisearch. Never published, no route to the internet.
  data:
    internal: true
  # Outbound only (RDS, S3, SES, Expo push, Sentry, ACME DNS).
  egress: {}

volumes:
  caddy-data:
  caddy-config:
  valkey-data:
  meili-data:
