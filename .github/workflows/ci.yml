name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo unless they say otherwise.
permissions:
  contents: read

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            chore
            ci
            build
          scopes: |
            api
            web
            mobile
            shared
            tokens
            ui-web
            ui-native
            infra
            docs
            repo
          requireScope: true
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: Start the summary with a lower-case letter and don't end it with a period.

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tests start PostgreSQL 18 and Valkey 9 with Testcontainers (Docker is on ubuntu-latest).
          - name: API (lint, types, tests)
            package: '@supporters/api'
            scripts: lint typecheck test
          - name: Web (lint, types, tests, build)
            package: '@supporters/web'
            scripts: lint typecheck test build
          - name: Mobile (types, config, tests, Android bundle)
            package: '@supporters/mobile'
            scripts: typecheck config:check test bundle:check
          - name: UI native (types, component tests)
            package: '@supporters/ui-native'
            scripts: typecheck test
          - name: Shared (types, tests)
            package: '@supporters/shared'
            scripts: typecheck test
          - name: UI web (types, component tests)
            package: '@supporters/ui-web'
            scripts: typecheck test
          - name: Design tokens (generated CSS, types, tests)
            package: '@supporters/design-tokens'
            scripts: check typecheck test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.scripts }}
        env:
          PACKAGE: ${{ matrix.package }}
          SCRIPTS: ${{ matrix.scripts }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          for script in $SCRIPTS; do
            echo "::group::$PACKAGE $script"
            pnpm --filter "$PACKAGE" --if-present run "$script"
            echo "::endgroup::"
          done

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Ignored advisories are listed, with reasons, under auditConfig in pnpm-workspace.yaml.
      - run: pnpm audit --prod --audit-level high
