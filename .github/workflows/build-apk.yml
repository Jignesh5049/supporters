name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Prepare APK for distribution
        run: |
          mkdir -p build-output
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/supporters.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: supporters-apk
          path: build-output/supporters.apk
          retention-days: 30

      - name: Create or update GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 build-output/supporters.apk --clobber || \
          gh release create v1.0.0 build-output/supporters.apk \
            --title "Supporters Android APK (v1.0.0)" \
            --notes "Direct installable Android APK for Supporters mobile app. Download \`supporters.apk\` below and install on your Android device."
